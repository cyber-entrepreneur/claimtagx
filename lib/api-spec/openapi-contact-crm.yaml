openapi: 3.1.0
info:
  title: ClaimTagX Contact CRM
  version: 0.1.0
  description: |
    OpenAPI 3.1 fragment for ClaimTagX public Contact Us and Platform Contact
    Operations. Paths are relative to the same `/api` server as `openapi.yaml`.

    **Auth**
    - Public `/contact/*` form endpoints are unauthenticated.
    - Inbound webhooks use `X-Webhook-Secret`.
    - Platform (and Handler) routes use first-party ClaimTagX auth: the
      `ctx_auth_session` cookie (an opaque session/refresh token) **or** an
      opaque `Authorization: Bearer` token. No hosted identity provider is used.
      Sign in via `POST /platform/auth/login` (email + password); MFA, password
      reset, invitation acceptance and first-owner bootstrap are also
      first-party endpoints under `/platform/auth/*`.

    **Permissions**
    Platform operations declare `x-permission` matching `PLATFORM_PERMISSIONS`
    in `artifacts/api-server/src/lib/crm/rbac.ts`. `GET /platform/me` requires
    an authenticated staff session but no specific permission.

    **Status**
    Live handlers are `x-status: implemented`. Remaining stubs are
    `x-status: planned`.
servers:
  - url: /api
    description: Base API path (mounted in artifacts/api-server/src/app.ts)
tags:
  - name: contact-public
    description: Unauthenticated public contact form
  - name: contact-webhooks
    description: Provider webhooks (inbound email, scheduling)
  - name: platform-auth
    description: First-party platform/handler identity (password, MFA, session cookie)
  - name: platform-inquiries
    description: Inbox, workspace, and inquiry mutations
  - name: platform-templates
    description: Email templates and versions
  - name: platform-config
    description: Qualification, workflows, routing, SLA, meetings
  - name: platform-workspace
    description: Staff, notifications, saved views, analytics
  - name: platform-governance
    description: Audit, DSAR, legal hold, retention, and privacy workflows
  - name: platform-marketing
    description: Governed marketing CMS (documents, versions, dual-control publish)
paths:
  /contact/bootstrap:
    get:
      operationId: getContactBootstrap
      tags: [contact-public]
      summary: Bootstrap the public contact form
      description: |
        Returns country options, optional IP-detected country (`CF-IPCountry`),
        current terms/privacy versions, message max length, and active taxonomy.
        Falls back to built-in taxonomy if the database is unavailable.
      x-status: implemented
      security: []
      parameters:
        - $ref: "#/components/parameters/CfIpCountry"
      responses:
        "200":
          description: Form bootstrap payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactBootstrap"

  /contact/inquiries:
    post:
      operationId: submitContactInquiry
      tags: [contact-public]
      summary: Submit a public contact inquiry
      description: |
        Validates and persists a contact inquiry. Idempotent on `idempotencyKey`
        (UUID in the body): a replay returns the original reference without a
        second insert. Rate-limited to 8 submissions per IP per 10 minutes.
        Sales inquiries require at least one `useCaseKeys` entry.
      x-status: implemented
      security: []
      parameters:
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactSubmitRequest"
      responses:
        "201":
          description: Inquiry accepted (or idempotent replay of an existing inquiry)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactSubmitResponse"
        "400":
          description: Validation failed, honeypot tripped, or phone rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactApiError"
        "429":
          description: Per-IP submit rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactApiError"
        "503":
          description: Bot-protection provider unavailable or misconfigured (fail closed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactApiError"
        "500":
          description: Submit failed after validation; caller should retry with the same idempotency key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactApiError"

  /contact/webhooks/inbound-email:
    post:
      operationId: inboundContactEmailWebhook
      tags: [contact-webhooks]
      summary: Attach an inbound customer email to an inquiry
      description: |
        Matches `CTX-YYYY-NNNNNN` in the subject. Unmatched payloads return
        202 `{ matched: false }`. Production requires `CONTACT_INBOUND_WEBHOOK_SECRET`
        and rejects unsigned requests with 503 when the secret is unset.
      x-status: implemented
      security:
        - webhookSecret: []
      parameters:
        - $ref: "#/components/parameters/WebhookSecret"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InboundEmailWebhookRequest"
      responses:
        "200":
          description: Matched and stored as a customer reply
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookMatchResponse"
        "202":
          description: Accepted but not matched to an inquiry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookMatchResponse"
        "400":
          description: Invalid payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactApiError"
        "401":
          description: Missing or incorrect webhook secret
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactApiError"
        "503":
          description: Inbound email is not configured (production, secret unset)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactApiError"

  /contact/webhooks/microsoft-graph/mail:
    post:
      operationId: microsoftGraphMailWebhook
      tags: [contact-webhooks]
      summary: Microsoft Graph mail change notifications
      description: |
        Production inbound mailbox webhook. Graph subscription validation echoes
        `validationToken` as `text/plain`. Change notifications are authorized via
        subscription `clientState` (not `X-Webhook-Secret`). Returns 202 when accepted.
      x-status: implemented
      security: []
      parameters:
        - in: query
          name: validationToken
          required: false
          schema: { type: string }
          description: Graph subscription validation handshake token
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              properties:
                value:
                  type: array
                  items:
                    type: object
                    additionalProperties: true
      responses:
        "200":
          description: Validation token echo (text/plain)
          content:
            text/plain:
              schema: { type: string }
        "202":
          description: Notifications accepted (or skipped when Graph is not configured outside production)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          description: Notification clientState unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactApiError"
        "503":
          description: Graph inbound not configured in production
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactApiError"

  /contact/webhooks/scheduling:
    post:
      operationId: schedulingContactWebhook
      tags: [contact-webhooks]
      summary: Update meeting booking status from an external scheduler
      description: |
        Resolves an inquiry by `reference` or latest inquiry for `email`.
        When `CONTACT_SCHEDULING_WEBHOOK_SECRET` is set, `X-Webhook-Secret` must match.
      x-status: implemented
      security:
        - webhookSecret: []
      parameters:
        - $ref: "#/components/parameters/WebhookSecret"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SchedulingWebhookRequest"
      responses:
        "200":
          description: Matched and meeting row updated when present
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookMatchResponse"
        "202":
          description: Accepted but no inquiry matched
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookMatchResponse"
        "400":
          description: Invalid payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactApiError"
        "401":
          description: Incorrect webhook secret
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactApiError"

  /contact/webhooks/whatsapp:
    get:
      operationId: whatsappContactWebhookGet
      tags: [contact-webhooks]
      summary: WhatsApp Cloud API webhook verification
      description: |
        Provider hub challenge handshake. Not a browser client. Signature and
        subscribe token are server-controlled. Not LIVE_VERIFIED without an
        approved Meta WhatsApp round trip.
      x-status: implemented
      x-browser-client: false
      security: []
      parameters:
        - in: query
          name: hub.mode
          schema: { type: string }
        - in: query
          name: hub.verify_token
          schema: { type: string }
        - in: query
          name: hub.challenge
          schema: { type: string }
      responses:
        "200":
          description: Challenge echo (text/plain)
          content:
            text/plain:
              schema: { type: string }
        "403":
          description: Verification rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactApiError"
    post:
      operationId: whatsappContactWebhook
      tags: [contact-webhooks]
      summary: WhatsApp Cloud API inbound webhook
      description: |
        HMAC-verified inbound events. Returns 401/403 on signature failure.
        Not LIVE_VERIFIED from local HMAC fixtures.
      x-status: implemented
      x-browser-client: false
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Accepted
        "202":
          description: Accepted without live dispatch
        "401":
          description: Signature unauthorized
        "413":
          description: Payload too large
        "415":
          description: Unsupported content type

  /contact/webhooks/meta:
    get:
      operationId: metaContactWebhookGet
      tags: [contact-webhooks]
      summary: Meta Messenger/Instagram webhook verification
      description: Provider hub challenge handshake. Not LIVE_VERIFIED without Meta app review.
      x-status: implemented
      x-browser-client: false
      security: []
      parameters:
        - in: query
          name: hub.mode
          schema: { type: string }
        - in: query
          name: hub.verify_token
          schema: { type: string }
        - in: query
          name: hub.challenge
          schema: { type: string }
      responses:
        "200":
          description: Challenge echo (text/plain)
          content:
            text/plain:
              schema: { type: string }
        "403":
          description: Verification rejected
    post:
      operationId: metaContactWebhook
      tags: [contact-webhooks]
      summary: Meta Messenger/Instagram inbound webhook
      description: HMAC-verified inbound events. Instagram vs Messenger is selected from payload object.
      x-status: implemented
      x-browser-client: false
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Accepted
        "401":
          description: Signature unauthorized
        "413":
          description: Payload too large
        "415":
          description: Unsupported content type

  /contact/webhooks/x:
    get:
      operationId: xContactWebhookGet
      tags: [contact-webhooks]
      summary: X (Twitter) Account Activity webhook verification
      description: CRC token handshake. Not LIVE_VERIFIED without X developer approval.
      x-status: implemented
      x-browser-client: false
      security: []
      parameters:
        - in: query
          name: crc_token
          schema: { type: string }
      responses:
        "200":
          description: CRC response JSON
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "403":
          description: Verification rejected
    post:
      operationId: xContactWebhook
      tags: [contact-webhooks]
      summary: X (Twitter) Account Activity inbound webhook
      description: Signature-verified inbound events. Not LIVE_VERIFIED from local fixtures.
      x-status: implemented
      x-browser-client: false
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Accepted
        "401":
          description: Signature unauthorized
        "413":
          description: Payload too large
        "415":
          description: Unsupported content type

  /platform/auth/login:
    post:
      operationId: platformAuthLogin
      tags: [platform-auth]
      summary: First-party email + password login
      description: |
        Authenticates against the first-party ClaimTagX auth platform. On full
        success sets the `ctx_auth_session` cookie and (for CRM accounts) links
        the staff row. Errors are intentionally generic to avoid account
        enumeration. When MFA is required, returns `mfaRequired: true` +
        `accountId`; complete via `POST /platform/auth/mfa/challenge`.
      x-status: implemented
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlatformLoginRequest"
      responses:
        "200":
          description: "Authenticated, MFA required, or verification required."
          headers:
            Set-Cookie:
              schema:
                type: string
              description: "HttpOnly `ctx_auth_session` cookie (set only on full success)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformLoginResponse"
        "401":
          description: Invalid email or password (generic)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactApiError"
        "429":
          description: Too many attempts (rate limited)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactApiError"

  /platform/auth/mfa/challenge:
    post:
      operationId: platformAuthMfaChallenge
      tags: [platform-auth]
      summary: Submit the second factor after an mfa_required login
      x-status: implemented
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                accountId:
                  type: string
                method:
                  type: string
                  enum: [totp, sms, recovery]
                  default: totp
                code:
                  type: string
              required: [accountId, code]
      responses:
        "200":
          description: "Authenticated (Set-Cookie `ctx_auth_session`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformLoginResponse"
        "401":
          description: Invalid code (generic)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactApiError"

  /platform/auth/logout:
    post:
      operationId: platformAuthLogout
      tags: [platform-auth]
      summary: Revoke the current session and clear the cookie
      x-status: implemented
      security:
        - sessionCookie: []
        - bearerToken: []
      responses:
        "204":
          description: Session revoked and cookie cleared
        "401":
          $ref: "#/components/responses/Unauthorized"

  /platform/auth/logout-all:
    post:
      operationId: platformAuthLogoutAll
      tags: [platform-auth]
      summary: Revoke every session for the current account
      x-status: implemented
      security:
        - sessionCookie: []
        - bearerToken: []
      responses:
        "204":
          description: All sessions revoked and cookie cleared
        "401":
          $ref: "#/components/responses/Unauthorized"

  /platform/auth/session:
    get:
      operationId: platformAuthSession
      tags: [platform-auth]
      summary: Resolve the current first-party session identity
      x-status: implemented
      security:
        - sessionCookie: []
        - bearerToken: []
      responses:
        "200":
          description: Account id, email, and linked staff (if any)
          content:
            application/json:
              schema:
                type: object
                properties:
                  accountId:
                    type: string
                  email:
                    type: ["string", "null"]
                  sessionId:
                    type: ["string", "null"]
                  staff:
                    oneOf:
                      - $ref: "#/components/schemas/PlatformStaffSession"
                      - type: "null"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /platform/auth/forgot-password:
    post:
      operationId: platformAuthForgotPassword
      tags: [platform-auth]
      summary: Request a password-reset code (always generic success)
      description: |
        Always returns `{ ok: true }` regardless of whether the account exists,
        to prevent account enumeration. If the account exists, a one-time reset
        code is emailed.
      x-status: implemented
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
              required: [email]
      responses:
        "200":
          description: Generic acknowledgement
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean

  /platform/auth/reset-password:
    post:
      operationId: platformAuthResetPassword
      tags: [platform-auth]
      summary: Reset a password with a one-time code (single-use)
      x-status: implemented
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                challengeId:
                  type: string
                code:
                  type: string
                newPassword:
                  type: string
                  minLength: 1
                  maxLength: 1024
              required: [challengeId, code, newPassword]
      responses:
        "200":
          description: Password reset
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        "400":
          description: Invalid/expired code or weak password (generic)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactApiError"

  /platform/auth/sessions:
    get:
      operationId: platformAuthListSessions
      tags: [platform-auth]
      summary: List active sessions for the current account
      description: |
        Requires the first-party `ctx_auth_session` cookie (or bearer token) and
        returns the active session inventory for the current account. The
        `current` field identifies the session resolved from the cookie/token on
        this request.
      x-status: implemented
      security:
        - sessionCookie: []
        - bearerToken: []
      responses:
        "200":
          description: Active session inventory for the current account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformAuthSessionsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /platform/auth/sessions/{id}:
    delete:
      operationId: platformAuthRevokeSession
      tags: [platform-auth]
      summary: Revoke one active session
      description: |
        Requires the first-party `ctx_auth_session` cookie (or bearer token) and
        revokes the selected session for the current account. If the selected
        session is the one backing the current `ctx_auth_session`, the response
        also clears that cookie.
      x-status: implemented
      security:
        - sessionCookie: []
        - bearerToken: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Session revoked; current cookie cleared when applicable
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /platform/auth/verify-email:
    post:
      operationId: platformAuthVerifyEmail
      tags: [platform-auth]
      summary: Confirm an email verification challenge
      description: |
        Public first-party verification endpoint. Confirms the one-time email
        challenge and does not set or require the `ctx_auth_session` cookie.
      x-status: implemented
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlatformAuthVerifyEmailRequest"
      responses:
        "200":
          description: Email challenge verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformAuthVerifiedResponse"
        "400":
          description: Invalid or expired verification code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactApiError"
        "410":
          description: Verification challenge has expired or was already consumed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactApiError"
        "422":
          description: Verification payload is not usable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactApiError"
        "429":
          $ref: "#/components/responses/RateLimited"

  /platform/auth/change-password:
    post:
      operationId: platformAuthChangePassword
      tags: [platform-auth]
      summary: Change the current account password
      description: |
        Requires the first-party `ctx_auth_session` cookie (or bearer token).
        On success all sessions for the account are revoked, including the
        current session, and the `ctx_auth_session` cookie is cleared so the
        client must authenticate again.
      x-status: implemented
      security:
        - sessionCookie: []
        - bearerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlatformAuthChangePasswordRequest"
      responses:
        "200":
          description: Password changed; all sessions revoked
          headers:
            Set-Cookie:
              schema:
                type: string
              description: Expired `ctx_auth_session` cookie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformAuthChangePasswordResponse"
        "400":
          description: Missing password, weak password, or incorrect current password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: Password payload is not usable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactApiError"
        "429":
          $ref: "#/components/responses/RateLimited"

  /platform/auth/mfa/enroll:
    post:
      operationId: platformAuthMfaEnroll
      tags: [platform-auth]
      summary: Start TOTP MFA enrollment
      description: |
        Requires the first-party `ctx_auth_session` cookie (or bearer token).
        Returns an `otpauthUri` for the current account; confirm enrollment with
        `POST /platform/auth/mfa/confirm`.
      x-status: implemented
      security:
        - sessionCookie: []
        - bearerToken: []
      responses:
        "200":
          description: TOTP enrollment started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformAuthMfaEnrollResponse"
        "400":
          description: Unable to start MFA enrollment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: MFA enrollment is already active or pending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactApiError"
        "429":
          $ref: "#/components/responses/RateLimited"

  /platform/auth/mfa/confirm:
    post:
      operationId: platformAuthMfaConfirm
      tags: [platform-auth]
      summary: Confirm pending TOTP MFA enrollment
      description: |
        Requires the first-party `ctx_auth_session` cookie (or bearer token) and
        verifies the code generated from the pending TOTP enrollment for the
        current account.
      x-status: implemented
      security:
        - sessionCookie: []
        - bearerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlatformAuthMfaConfirmRequest"
      responses:
        "200":
          description: MFA enrollment confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CrmOkResponse"
        "400":
          description: Verification code is missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "410":
          description: Pending MFA enrollment expired or was already consumed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactApiError"
        "422":
          description: MFA confirmation payload is not usable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactApiError"
        "429":
          $ref: "#/components/responses/RateLimited"

  /platform/auth/mfa/recovery-codes:
    post:
      operationId: platformAuthMfaRecoveryCodes
      tags: [platform-auth]
      summary: Generate MFA recovery codes
      description: |
        Requires the first-party `ctx_auth_session` cookie (or bearer token).
        Generates a fresh set of one-time recovery codes for the current account.
      x-status: implemented
      security:
        - sessionCookie: []
        - bearerToken: []
      responses:
        "200":
          description: Fresh recovery codes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformAuthRecoveryCodesResponse"
        "400":
          description: Unable to generate recovery codes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: MFA must be enabled before recovery codes can be generated
          content:
