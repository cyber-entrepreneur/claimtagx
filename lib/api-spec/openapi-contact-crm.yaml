components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: ctx_auth_session
      description: >
        First-party opaque session cookie (`ctx_auth_session`). HttpOnly, host-only
        (no Domain), `SameSite=Lax`, `path=/`; Secure in production. claimtagx.com
        and api.claimtagx.com are schemeful same-site, so Lax covers SPA→API
        credentialed calls. Its value is an opaque refresh token backed by the
        first-party auth platform; only its hash is persisted server-side.
        Cookie-bearing writes are additionally protected by an Origin allow-list
        (CSRF) check.
    bearerToken:
      type: http
      scheme: bearer
      description: >
        First-party opaque access token (or refresh token) via
        `Authorization: Bearer`. Used by non-browser/API clients. Tokens are
        opaque (not JWTs); only their hashes are stored.
    webhookSecret:
      type: apiKey
      in: header
      name: X-Webhook-Secret
      description: Shared secret for inbound email and scheduling webhooks.
  parameters:
    InquiryId:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
    ContactId:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
    TemplateId:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
    MarketingVersionId:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
    RecordLockId:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
    ExportJobId:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
    TaxonomyId:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
    ModelId:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
    WorkflowId:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
    RoutingId:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
    SlaPolicyId:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
    MeetingTypeId:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
    SavedViewId:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
    PageLimit:
      in: query
      name: limit
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
      description: Inbox default 50, capped at 100.
    PageOffset:
      in: query
      name: offset
      schema:
        type: integer
        minimum: 0
        default: 0
      description: Deprecated for `sort=createdAt` (keyset). Still accepted for score/lastActivityAt first-page offset only until those sorts gain cursors.
    PageCursor:
      in: query
      name: cursor
      schema:
        type: string
      description: Opaque keyset cursor (createdAt + id). Forward page token from `nextCursor`.
    XRequestId:
      in: header
      name: X-Request-Id
      required: false
      schema:
        type: string
      description: Correlation id echoed on public submit responses. Generated if omitted.
    IdempotencyKeyHeader:
      in: header
      name: Idempotency-Key
      required: false
      schema:
        type: string
        format: uuid
      description: |
        Recommended client header for retry-safe writes. Public submit currently
        requires the same UUID in the JSON body field `idempotencyKey`; the
        server does not read this header yet. Planned DSAR export should honor it.
    WebhookSecret:
      in: header
      name: X-Webhook-Secret
      required: false
      schema:
        type: string
      description: "Required when the corresponding `CONTACT_*_WEBHOOK_SECRET` env is set."
    CfIpCountry:
      in: header
      name: CF-IPCountry
      required: false
      schema:
        type: string
        minLength: 2
        maxLength: 2
      description: "Cloudflare country code. `XX` and `T1` are ignored."
  responses:
    Unauthorized:
      description: Missing or invalid staff session
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ContactApiError"
    Forbidden:
      description: "Authenticated but missing `x-permission`"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ContactApiError"
    ForbiddenOrigin:
      description: Request origin is not on the CORS allowlist
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ContactApiError"
    NotFound:
      description: Entity not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ContactApiError"
    BadRequest:
      description: Invalid request body or query
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ContactApiError"
    Conflict:
      description: Optimistic concurrency conflict or invalid state transition
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ContactApiError"
    NotImplemented:
      description: Planned endpoint; handler is not wired
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ContactApiError"
    RateLimited:
      description: Admin or public rate limit exceeded
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ContactApiError"
  schemas:
    ContactApiError:
      type: object
      properties:
        error:
          type: string
        correlationId:
          type: string
          description: Present on public submit errors.
      required:
        - error
    CrmOkResponse:
      type: object
      properties:
        ok:
          type: boolean
          const: true
      required:
        - ok
    CrmJsonMap:
      type: object
      additionalProperties: true
    CrmInquiryType:
      type: string
      enum: [sales, general, technical, billing, other]
    CrmInquiryStatus:
      type: string
      enum:
        - NEW
        - TRIAGED
        - ASSIGNED
        - IN_PROGRESS
        - WAITING_FOR_CUSTOMER
        - WAITING_INTERNAL
        - RESOLVED
        - CLOSED
        - SPAM
        - DUPLICATE
        - CANCELLED
    CrmInquiryPriority:
      type: string
      enum: [low, normal, high, urgent]
    CrmQualificationStatus:
      type: string
      enum:
        - UNASSESSED
        - UNQUALIFIED
        - MARKETING_QUALIFIED
