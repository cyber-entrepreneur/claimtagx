  /platform/contact/inquiries:
    get:
      operationId: listPlatformContactInquiries
      tags: [platform-inquiries]
      summary: Paginated inbox of inquiries
      description: |
        Joins contact, company, assignee, first-response SLA, and the calling
        staff member's read cursor. `total` is the SQL count **before** the
        in-memory `readState` filter.
      x-status: implemented
      x-permission: inquiries.view
      security:
        - sessionCookie: []
        - bearerToken: []
      parameters:
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/PageOffset"
        - $ref: "#/components/parameters/PageCursor"
        - in: query
          name: sort
          schema:
            type: string
            enum: [createdAt, lastActivityAt, score]
            default: createdAt
          description: "`score` sorts by `qualificationScore`."
        - in: query
          name: dir
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - in: query
          name: status
          schema:
            $ref: "#/components/schemas/CrmInquiryStatus"
        - in: query
          name: qualificationStatus
          schema:
            $ref: "#/components/schemas/CrmQualificationStatus"
        - in: query
          name: country
          schema:
            type: string
            minLength: 2
            maxLength: 2
          description: ISO 3166-1 alpha-2; compared uppercased.
        - in: query
          name: assignedStaffId
          schema:
            type: string
            format: uuid
        - in: query
          name: source
          schema:
            type: string
        - in: query
          name: from
          schema:
            type: string
            format: date-time
          description: "Inclusive lower bound on `createdAt` (`new Date(from)`)."
        - in: query
          name: to
          schema:
            type: string
            format: date-time
          description: "Inclusive upper bound on `createdAt` (`new Date(to)`)."
        - in: query
          name: search
          schema:
            type: string
          description: Case-insensitive substring on name, email, phone, company, or reference.
        - in: query
          name: readState
          schema:
            type: string
            enum: [unread, read]
        - in: query
          name: inquiryType
          schema:
            type: string
          description: Filter by inquiry type (e.g. sales, support).
        - in: query
          name: channel
          schema:
            type: string
          description: Filter by origin channel (website, whatsapp, instagram, facebook, tiktok, x, linkedin, microsoft365).
        - in: query
          name: priority
          schema:
            type: string
      responses:
        "200":
          description: Page of inbox rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CrmInquiryListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

