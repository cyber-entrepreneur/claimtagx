      responses:
        "201":
          description: Owner bootstrapped and session cookie set
          headers:
            Set-Cookie:
              schema:
                type: string
              description: HttpOnly `ctx_auth_session` cookie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformAuthInviteAcceptResponse"
        "400":
          description: Invalid payload, weak password, or provisioning failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactApiError"
        "401":
          description: Invalid or expired bootstrap token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactApiError"
        "409":
          description: Bootstrap is closed or the token was already consumed
          content:
            application/json:
              schema:
