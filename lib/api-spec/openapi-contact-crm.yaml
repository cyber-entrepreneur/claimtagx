        token. When no staff exists, it provisions the owner account, consumes
        the token, issues a session, and sets the HttpOnly `ctx_auth_session`
        cookie.
      x-status: implemented
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
