        the HttpOnly `ctx_auth_session` cookie.
      x-status: implemented
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlatformAuthInviteAcceptRequest"
      responses:
        "201":
          description: Invitation accepted and session cookie set
          headers:
            Set-Cookie:
              schema:
                type: string
              description: HttpOnly `ctx_auth_session` cookie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformAuthInviteAcceptResponse"
        "400":
          description: Invalid token, expired token, weak password, or invalid payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactApiError"
        "403":
          description: Invite email is not authorized for Platform Admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactApiError"
        "409":
          description: Account is already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactApiError"
        "410":
          description: Invitation has expired or was already accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactApiError"
        "422":
          description: Invitation acceptance payload is not usable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactApiError"
        "429":
          $ref: "#/components/responses/RateLimited"

